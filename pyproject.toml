[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tennisage"
version = "0.1.0"
description = "Fetch Tennis Abstract career matches and plot player vs opponent age"
requires-python = ">=3.9"
dependencies = ["pandas", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]